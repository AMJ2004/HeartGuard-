{% extends "base.html" %}
{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">Your Personalized Diet Plan</h2>

    <div class="card p-4 shadow">

        <h4>Recommended Diet:</h4>
        <p>{{ diet }}</p>

        <h4 class="mt-4">Daily Calories:</h4>
        <p>{{ calories }}</p>

        <h4 class="mt-4">Recommended Recipes:</h4>

        <div class="row">

            {% for r in recipes %}
            <div class="col-md-4">
                <div class="card mb-3 shadow">
                    <img src="{{ url_for('static', filename='images/food.jpg') }}" class="card-img-top">
                    <div class="card-body">
                        <h5>{{ r }}</h5>
                        <p>Healthy & nutritious meal for heart care.</p>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>

    </div>

</div>

{% endblock %}
