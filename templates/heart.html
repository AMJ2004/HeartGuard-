{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">HeartGuard+ AI Health Assessment</h2>

    <form method="POST" action="{{ url_for('result') }}" class="card p-4 shadow">

        <label>Age</label>
        <input type="number" name="age" class="form-control mb-3" placeholder="Age" required>

        <label>Gender</label>
        <select name="gender" class="form-control mb-3">
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select>

        <label>Systolic BP</label>
        <input type="number" name="sysBP" class="form-control mb-3" placeholder="Systolic BP" required>

        <label>Diastolic BP</label>
        <input type="number" name="diaBP" class="form-control mb-3" placeholder="Diastolic BP" required>

        <label>Glucose Level</label>
        <input type="number" name="glucose" class="form-control mb-3" placeholder="Glucose Level" required>

        <label>Cholesterol</label>
        <input type="number" name="totChol" class="form-control mb-3" placeholder="Cholesterol" required>

        <button type="submit" class="btn btn-primary">Run AI Analysis</button>

    </form>
</div>

{% endblock %}
