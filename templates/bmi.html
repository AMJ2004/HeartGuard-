{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">BMI Calculator</h2>

    <form method="POST" action="{{ url_for('bmi') }}" class="card p-4 shadow">

        <label>Weight (kg)</label>
        <input type="number" name="weight" class="form-control mb-3" required>

        <label>Height (cm)</label>
        <input type="number" name="height" class="form-control mb-3" required>

        <button type="submit" class="btn btn-success">Calculate BMI</button>

    </form>

    {% if bmi %}
        <div class="alert alert-info mt-4 text-center">
            Your BMI is <strong>{{ bmi }}</strong>
        </div>
    {% endif %}

</div>

{% endblock %}
